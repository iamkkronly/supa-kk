<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notes App with Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md mx-auto p-6 bg-white shadow-xl rounded-2xl">
    <h1 class="text-3xl font-bold mb-4 text-center text-purple-600">Notes Taker</h1>
    
    <!-- Auth Section -->
    <div id="auth-section">
      <input id="email" type="email" placeholder="Email" class="w-full p-2 mb-2 border rounded-lg" />
      <input id="password" type="password" placeholder="Password" class="w-full p-2 mb-4 border rounded-lg" />
      <button onclick="signUp()" class="w-full bg-purple-500 hover:bg-purple-600 text-white py-2 rounded-lg mb-2">Sign Up</button>
      <button onclick="signIn()" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg">Login</button>
    </div>

    <!-- Notes Section -->
    <div id="notes-section" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Your Notes</h2>
        <button onclick="signOut()" class="text-red-500 text-sm">Logout</button>
      </div>
      <textarea id="note-input" rows="3" class="w-full p-2 mb-2 border rounded-lg" placeholder="Write your note..."></textarea>
      <button onclick="addNote()" class="w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg mb-4">Add Note</button>
      <div id="notes-list" class="space-y-2"></div>
    </div>
  </div>

  <script>
    // Your Supabase credentials
    const SUPABASE_URL = 'https://heajntisnbzqysclktjl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlYWpudGlzbmJ6cXlzY2xrdGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYyMDU5MDgsImV4cCI6MjA2MTc4MTkwOH0.pc-V1K8XZ3SNTtiGZ-VE1VIh430_4_kTMdbrf_lfGyE';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const authSection = document.getElementById('auth-section');
    const notesSection = document.getElementById('notes-section');
    const notesList = document.getElementById('notes-list');

    checkSession();

    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signUp({ email, password });
      if (error) alert(error.message);
      else alert("Check your email to confirm account!");
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else {
        showNotes();
        loadNotes();
      }
    }

    async function signOut() {
      await supabase.auth.signOut();
      authSection.classList.remove('hidden');
      notesSection.classList.add('hidden');
    }

    async function checkSession() {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        showNotes();
        loadNotes();
      }
    }

    function showNotes() {
      authSection.classList.add('hidden');
      notesSection.classList.remove('hidden');
    }

    async function addNote() {
      const user = (await supabase.auth.getUser()).data.user;
      const content = document.getElementById('note-input').value;
      if (!content) return;
      await supabase.from('notes').insert({ user_id: user.id, content });
      document.getElementById('note-input').value = '';
      loadNotes();
    }

    async function loadNotes() {
      const user = (await supabase.auth.getUser()).data.user;
      const { data, error } = await supabase.from('notes').select('*').eq('user_id', user.id).order('id', { ascending: false });
      if (error) return alert(error.message);
      notesList.innerHTML = '';
      data.forEach(note => {
        const noteEl = document.createElement('div');
        noteEl.className = 'p-3 bg-gray-200 rounded-lg flex justify-between items-center';
        noteEl.innerHTML = `
          <span>${note.content}</span>
          <button onclick="deleteNote(${note.id})" class="text-red-500 text-sm">Delete</button>
        `;
        notesList.appendChild(noteEl);
      });
    }

    async function deleteNote(id) {
      await supabase.from('notes').delete().eq('id', id);
      loadNotes();
    }
  </script>
</body>
</html>
