<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Taker App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const SUPABASE_URL = "https://heajntisnbzqysclktjl.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlYWpudGlzbmJ6cXlzY2xrdGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYyMDU5MDgsImV4cCI6MjA2MTc4MTkwOH0.pc-V1K8XZ3SNTtiGZ-VE1VIh430_4_kTMdbrf_lfGyE";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f3f4f6;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .hidden {
      display: none;
    }
    .note-card {
      background: #e5e7eb;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container" id="auth">
    <h2>Sign Up</h2>
    <input type="email" id="signup-email" placeholder="Email" /><br /><br />
    <input type="password" id="signup-password" placeholder="Password" /><br /><br />
    <button onclick="signup()">Sign Up</button>
    <p>Already have an account? <a href="#" onclick="toggleAuth(true)">Login</a></p><div class="hidden" id="login-section">
  <h2>Login</h2>
  <input type="email" id="login-email" placeholder="Email" /><br /><br />
  <input type="password" id="login-password" placeholder="Password" /><br /><br />
  <button onclick="login()">Login</button>
  <p>Need account? <a href="#" onclick="toggleAuth(false)">Sign Up</a></p>
</div>

  </div>  <div class="container hidden" id="notes-app">
    <h2>Welcome!</h2>
    <input type="text" id="note-input" placeholder="Write a note..." />
    <button onclick="addNote()">Add Note</button>
    <div id="notes-list"></div>
    <button onclick="logout()">Logout</button>
  </div>  <script>
    const toggleAuth = (isLogin) => {
      document.getElementById('login-section').classList.toggle('hidden', !isLogin);
    };

    const signup = async () => {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const { data, error } = await supabase.auth.signUp({
        email,
        password
      });
      if (error) return alert(error.message);
      alert("Signup successful! Check your email to confirm account.");
    };

    const login = async () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return alert(error.message);
      document.getElementById('auth').classList.add('hidden');
      document.getElementById('notes-app').classList.remove('hidden');
      loadNotes();
    };

    const logout = async () => {
      await supabase.auth.signOut();
      document.getElementById('notes-app').classList.add('hidden');
      document.getElementById('auth').classList.remove('hidden');
    };

    const addNote = async () => {
      const note = document.getElementById('note-input').value;
      const user = (await supabase.auth.getUser()).data.user;
      const { data, error } = await supabase.from('notes').insert([{ user_id: user.id, content: note }]);
      if (!error) {
        document.getElementById('note-input').value = '';
        loadNotes();
      }
    };

    const loadNotes = async () => {
      const user = (await supabase.auth.getUser()).data.user;
      const { data, error } = await supabase.from('notes').select('*').eq('user_id', user.id);
      const list = document.getElementById('notes-list');
      list.innerHTML = '';
      data.forEach(note => {
        const div = document.createElement('div');
        div.className = 'note-card';
        div.textContent = note.content;
        list.appendChild(div);
      });
    };
  </script></body>
</html>
