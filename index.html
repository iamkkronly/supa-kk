<!DOCTYPE html>
<html lang="en" class="bg-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Taker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  <div id="auth" class="w-full max-w-sm bg-white shadow-md p-6 rounded-lg">
    <h2 class="text-2xl font-bold mb-4 text-center">Welcome to Notes</h2>
    <input id="email" type="email" placeholder="Email" class="mb-2 w-full p-2 border rounded" />
    <input id="password" type="password" placeholder="Password" class="mb-4 w-full p-2 border rounded" />
    <button onclick="login()" class="bg-blue-600 text-white w-full py-2 rounded mb-2">Login</button>
    <button onclick="signup()" class="bg-green-600 text-white w-full py-2 rounded">Sign Up</button>
  </div>

  <div id="notesApp" class="hidden w-full max-w-2xl mt-8">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-3xl font-semibold">My Notes</h2>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
    </div>

    <div class="flex mb-4">
      <input id="noteInput" type="text" placeholder="Write a note..." class="flex-1 p-2 border rounded-l" />
      <button onclick="addNote()" class="bg-blue-600 text-white px-4 rounded-r">Add</button>
    </div>

    <ul id="notesList" class="space-y-2"></ul>
  </div>

  <script>
    // Initialize Supabase Client
    const supabase = supabase.createClient(
      'https://heajntisnbzqysclktjl.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlYWpudGlzbmJ6cXlzY2xrdGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYyMDU5MDgsImV4cCI6MjA2MTc4MTkwOH0.pc-V1K8XZ3SNTtiGZ-VE1VIh430_4_kTMdbrf_lfGyE'
    );

    const authDiv = document.getElementById('auth');
    const notesApp = document.getElementById('notesApp');
    const notesList = document.getElementById('notesList');
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    const noteInput = document.getElementById('noteInput');

    // Function to log in the user
    const login = async () => {
      const { error, user } = await supabase.auth.signInWithPassword({
        email: emailEl.value,
        password: passEl.value,
      });
      if (error) return alert(error.message);
      loadNotes(user);
    };

    // Function to sign up a new user
    const signup = async () => {
      const { error } = await supabase.auth.signUp({
        email: emailEl.value,
        password: passEl.value,
      });
      if (error) return alert(error.message);
      
      // Auto-login after successful signup
      await login();
    };

    // Function to log out the user
    const logout = async () => {
      await supabase.auth.signOut();
      authDiv.classList.remove('hidden');
      notesApp.classList.add('hidden');
    };

    // Function to load notes for the logged-in user
    const loadNotes = async (user) => {
      if (!user) return;

      authDiv.classList.add('hidden');
      notesApp.classList.remove('hidden');

      const { data, error } = await supabase
        .from('notes')
        .select('*')
        .eq('user_id', user.id)
        .order('id', { ascending: false });

      if (error) return alert(error.message);

      notesList.innerHTML = '';
      data.forEach(note => {
        const li = document.createElement('li');
        li.className = 'bg-white p-3 rounded shadow flex justify-between items-center';
        li.innerHTML = `
          <span>${note.content}</span>
          <button onclick="deleteNote(${note.id})" class="text-red-500">Delete</button>
        `;
        notesList.appendChild(li);
      });
    };

    // Function to add a new note
    const addNote = async () => {
      const user = supabase.auth.user();
      const { error } = await supabase.from('notes').insert([
        { content: noteInput.value, user_id: user.id },
      ]);
      if (error) return alert(error.message);

      noteInput.value = '';
      loadNotes(user);
    };

    // Function to delete a note
    const deleteNote = async (id) => {
      const user = supabase.auth.user();
      await supabase.from('notes').delete().eq('id', id);
      loadNotes(user);
    };

    // Check if the user is logged in when the page loads
    supabase.auth.getUser().then(({ data: { user } }) => {
      if (user) loadNotes(user);
      else authDiv.classList.remove('hidden');
    });
  </script>
</body>
</html>
