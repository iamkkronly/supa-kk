<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notes Taker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-xl mx-auto p-6 mt-10 bg-white rounded-2xl shadow-xl space-y-6" id="auth-section">
    <h1 class="text-3xl font-bold text-center">Notes Taker</h1>

    <div class="space-y-4">
      <input id="email" type="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg"/>
      <input id="password" type="password" placeholder="Password" class="w-full px-4 py-2 border rounded-lg"/>
      <div class="flex justify-between space-x-2">
        <button onclick="signUp()" class="bg-green-500 text-white w-full py-2 rounded-xl">Sign Up</button>
        <button onclick="login()" class="bg-blue-500 text-white w-full py-2 rounded-xl">Login</button>
      </div>
    </div>
  </div>

  <div class="max-w-xl mx-auto p-6 mt-10 bg-white rounded-2xl shadow-xl hidden" id="notes-section">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Your Notes</h2>
      <button onclick="logout()" class="text-red-500 font-semibold">Logout</button>
    </div>
    <textarea id="note" rows="6" class="w-full p-4 border rounded-xl resize-none" placeholder="Start typing your notes..."></textarea>
    <button onclick="saveNote()" class="mt-4 w-full py-2 bg-purple-600 text-white rounded-xl hover:bg-purple-700">Save Note</button>
    <div id="saved-note" class="mt-4 text-sm text-gray-600"></div>
  </div>

  <script>
    const supabaseUrl = 'https://heajntisnbzqysclktjl.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlYWpudGlzbmJ6cXlzY2xrdGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYyMDU5MDgsImV4cCI6MjA2MTc4MTkwOH0.pc-V1K8XZ3SNTtiGZ-VE1VIh430_4_kTMdbrf_lfGyE';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const authSection = document.getElementById('auth-section');
    const notesSection = document.getElementById('notes-section');
    const noteBox = document.getElementById('note');
    const savedNote = document.getElementById('saved-note');

    async function signUp() {
      const { error } = await supabase.auth.signUp({
        email: email.value,
        password: password.value
      });
      alert(error ? error.message : 'Signup successful! Check your email to verify.');
    }

    async function login() {
      const { error } = await supabase.auth.signInWithPassword({
        email: email.value,
        password: password.value
      });
      if (error) return alert(error.message);
      showNotes();
    }

    async function logout() {
      await supabase.auth.signOut();
      authSection.classList.remove('hidden');
      notesSection.classList.add('hidden');
    }

    async function showNotes() {
      authSection.classList.add('hidden');
      notesSection.classList.remove('hidden');

      const { data: { user } } = await supabase.auth.getUser();
      const { data } = await supabase
        .from('notes')
        .select('content')
        .eq('user_id', user.id)
        .single();
      if (data) {
        noteBox.value = data.content;
        savedNote.innerText = "Note loaded successfully!";
      }
    }

    async function saveNote() {
      const { data: { user } } = await supabase.auth.getUser();
      const { error } = await supabase
        .from('notes')
        .upsert([{ user_id: user.id, content: noteBox.value }], { onConflict: ['user_id'] });

      savedNote.innerText = error ? 'Failed to save!' : 'Note saved successfully!';
    }

    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) showNotes();
    });
  </script>
</body>
</html>
