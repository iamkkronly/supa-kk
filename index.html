<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notes Taker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-300 via-pink-300 to-red-300 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white shadow-xl rounded-xl w-full max-w-xl p-8 space-y-6">
    <h1 class="text-3xl font-bold text-center text-purple-700">Notes Taker</h1>
    
    <div id="auth-section" class="space-y-4">
      <input id="email" type="email" placeholder="Email" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"/>
      <input id="password" type="password" placeholder="Password" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"/>
      <div class="flex justify-between">
        <button onclick="signUp()" class="bg-purple-600 text-white py-2 px-4 rounded hover:bg-purple-700 transition">Sign Up</button>
        <button onclick="login()" class="bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700 transition">Login</button>
      </div>
    </div>

    <div id="notes-section" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-semibold text-purple-700">Your Notes</h2>
        <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition">Logout</button>
      </div>
      <textarea id="note" placeholder="Start typing..." rows="6" class="w-full p-3 border border-purple-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
      <button onclick="saveNote()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Save Note</button>
      <p id="saved-note" class="text-center text-sm text-gray-500"></p>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
